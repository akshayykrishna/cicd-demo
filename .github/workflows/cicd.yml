name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t cicd-demo .

    - name: Success Message
      run: echo "Pipeline Successful"

      # (Optional) Run container test
      - name: Run container
        run: docker run --rm -d -p 8080:80 my-html-app
